# 需求台账数据库保活:Supabase 免费版闲置 7 天会休眠,这里每 3 天访问一次。
# 在 GitHub 服务器上运行,不依赖本机、代理和 Claude。失败时 GitHub 会发邮件通知。
name: Supabase keepalive

on:
  schedule:
    - cron: "17 4 */3 * *"   # UTC 04:17 = 北京时间 12:17,每 3 天一次
  workflow_dispatch:          # 支持在 Actions 页面手动点 Run

permissions:
  contents: write             # 只用于下面的心跳提交

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::仓库还没有配置 SUPABASE_KEY 这个 Secret"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
            "https://vamescfkjllfltuamvxn.supabase.co/rest/v1/requirements?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase 返回 HTTP $code(521 = 项目已休眠,请到 supabase.com/dashboard 点 Restore project)"
            exit 1
          fi

      # GitHub 会停用 60 天无活动仓库的定时任务;距上次提交超过 45 天就提交一次空心跳
      - uses: actions/checkout@v4
      - name: Heartbeat commit
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "距上次提交 $days 天"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive heartbeat"
            git push
          fi
